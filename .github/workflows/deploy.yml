name: Deploy to GitHub Pages

# Publicación DELIBERADA: el push ya no despliega. Para publicar:
#   gh workflow run deploy.yml --repo <owner>/saladin-spack
# o desde la pestaña Actions → Deploy to GitHub Pages → Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEPLOY_TARGET: gh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build with Astro
        uses: withastro/action@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
